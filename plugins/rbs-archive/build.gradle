apply plugin: 'opensearch.internal-cluster-test'

opensearchplugin {
    description 'RBS Archive Plugin — provides TAR-based upload strategies for OpenSearch Remote Backed Storage'
    classname 'org.opensearch.plugin.rbs.archive.RbsArchivePlugin'
}

// No runtime external dependencies — uses OpenSearch server APIs only.
// commons-compress is used ONLY in tests as an independent TAR validator.
dependencies {
    // commons-compress + commons-io are used ONLY in tests as an independent TAR validator.
    // commons-compress 1.26+ requires commons-io at runtime (NullInputStream etc.)
    testImplementation "org.apache.commons:commons-compress:${versions.commonscompress}"
    testImplementation "commons-io:commons-io:${versions.commonsio}"

    // internalClusterTest: needs RemoteStoreBaseIntegTestCase from the server's internalClusterTest
    // source set. This is the standard OpenSearch pattern for plugin ITs that test remote-store
    // behaviour (see repository-s3, repository-azure, etc.).
    internalClusterTestImplementation(project(":server").sourceSets.internalClusterTest.output)
    internalClusterTestImplementation(project(":test:framework"))
}
